services:
  database:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${WP_DB_NAME:?Set WP_DB_NAME in wordpress/.env}
      MARIADB_USER: ${WP_DB_USER:?Set WP_DB_USER in wordpress/.env}
      MARIADB_PASSWORD: ${WP_DB_PASSWORD:?Set WP_DB_PASSWORD in wordpress/.env}
      MARIADB_ROOT_PASSWORD: ${WP_DB_ROOT_PASSWORD:?Set WP_DB_ROOT_PASSWORD in wordpress/.env}
    volumes:
      - database_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  wordpress:
    image: wordpress:php8.3-apache
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:80"
    environment:
      WORDPRESS_DB_HOST: database:3306
      WORDPRESS_DB_NAME: ${WP_DB_NAME:?Set WP_DB_NAME in wordpress/.env}
      WORDPRESS_DB_USER: ${WP_DB_USER:?Set WP_DB_USER in wordpress/.env}
      WORDPRESS_DB_PASSWORD: ${WP_DB_PASSWORD:?Set WP_DB_PASSWORD in wordpress/.env}
    volumes:
      - wordpress_data:/var/www/html
      - ./citrine-headless:/var/www/html/wp-content/plugins/citrine-headless:ro

volumes:
  database_data:
  wordpress_data:
